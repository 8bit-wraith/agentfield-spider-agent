name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Verify imports compile
        run: uv run python -m py_compile main.py spider_server.py reasoners/*.py spider/*.py

      - name: Mypy
        run: uv run mypy spider/ main.py spider_server.py reasoners/

      - name: Compose syntax
        run: cp .env.example .env && docker compose config > /dev/null

  test:
    name: test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      # Fast fail: bootstrap imports + /health readiness contract.
      - name: Smoke
        run: uv run pytest tests/test_smoke.py -q --tb=line --no-header

      # Core: fetch pipeline, security, dispatch, sessions/evasion, HTTP routes.
      - name: Core
        run: |
          uv run pytest \
            tests/test_security.py \
            tests/test_dispatch.py \
            tests/test_fetch_errors.py \
            tests/test_errors.py \
            tests/test_evasion.py \
            tests/test_sessions.py \
            tests/test_state.py \
            tests/test_queue.py \
            tests/test_politeness.py \
            tests/test_proxy.py \
            tests/test_fetchers_github.py \
            tests/test_fetchers_hn.py \
            tests/test_fetchers_reddit.py \
            tests/test_spider_skill.py \
            tests/test_routes.py \
            tests/test_crawl.py \
            -q --tb=short -ra

      # Extended: optional backends, sinks, feeds, profiles, parsers.
      - name: Extended
        run: |
          uv run pytest \
            tests/test_browsers.py \
            tests/test_chroma_sink.py \
            tests/test_docling_parser.py \
            tests/test_extract.py \
            tests/test_feeds.py \
            tests/test_profiles.py \
            tests/test_sitemap.py \
            -q --tb=short -ra

  # Docker image build via Docker Buildx Cloud. Runs after tests pass.
  # On pull_request: builds-only (no registry push) — surfaces build
  # breakage early without polluting :latest.
  # On push to main: builds + pushes :latest and :sha-<7> to Docker Hub.
  #
  # Required configuration (in the GitHub "main" Environment, Secrets tab):
  #   DOCKER_USER  — Docker Hub account name
  #   DOCKER_PAT   — Docker Hub personal access token, R/W/D scope
  # ``environment: main`` scopes the job to that environment so the
  # secrets are accessible. The Buildx Cloud endpoint
  # (60ph3r/main-gh-builder-joe) is owner-managed in Docker Cloud.
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test
    environment: main
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "60ph3r/main-gh-builder-joe"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          tags: |
            ${{ secrets.DOCKER_USER }}/agentfield-spider-agent:latest
            ${{ secrets.DOCKER_USER }}/agentfield-spider-agent:sha-${{ github.sha }}
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
