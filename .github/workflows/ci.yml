name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Verify imports compile
        run: uv run python -m py_compile main.py spider_server.py reasoners/*.py spider/*.py

      - name: Mypy
        run: uv run mypy spider/ main.py spider_server.py reasoners/

      - name: Run tests
        run: uv run pytest -v --tb=short

  docker-docling:
    name: Docker Docling image
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: main
    timeout-minutes: 60
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER || vars.DOCKER_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: "60ph3r/main-gh-builder-joe"

      - name: Build and push Docling image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            INSTALL_DOCLING=1
          tags: |
            ${{ env.DOCKER_USER }}/agentfield-spider-agent:docling-latest
            ${{ env.DOCKER_USER }}/agentfield-spider-agent:docling-${{ github.sha }}
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
