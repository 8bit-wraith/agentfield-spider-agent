apiVersion: v1
kind: ConfigMap
metadata:
  name: spider-config
  labels:
    app: spider-agent
data:
  # --- AgentField ---
  AGENT_NODE_ID: "spider-agent"
  AGENTFIELD_SERVER: "http://control-plane.default.svc.cluster.local:8080"
  AGENT_CALLBACK_URL: "http://spider-agent.default.svc.cluster.local:8005"
  PORT: "8005"

  # --- HTTP surface ---
  CRAWLER_PORT: "11700"

  # Agent process talks to the HTTP process via localhost — they share
  # the pod (sidecar pattern). Override only if you split the pods.
  SPIDER_HTTP_URL: "http://localhost:11700"
  SPIDER_TIMEOUT_S: "60"

  # --- Redis ---
  # Assumes a redis Service in the same namespace. To bundle a redis
  # sidecar instead, add a third container and set this to
  # redis://localhost:6379/0.
  REDIS_URL: "redis://redis.default.svc.cluster.local:6379/0"

  # --- Crawl politeness ---
  CRAWL_HOST_RPS: "1.0"
  CRAWL_HOST_BURST: "1"
  CRAWL_ROBOTS_TTL_S: "3600"
  CRAWL_ROBOTS_UA: "agentfield-spider/0.1"
  CRAWL_ROBOTS_DISABLE: "0"
  # Dispatcher fan-out: max concurrent fetch jobs drained from
  # crawler:queue. This is the primary throughput lever — the pod is
  # single-replica by design (see deployment.yaml), so scale here +
  # resource limits, not via replicas. CRAWL_HOST_RPS still throttles
  # per-target politeness independently.
  #
  # NOTE: when egressing through a single mobile proxy (SPIDER_PROXY_URL,
  # e.g. the S8 4G gateway) ALL of this concurrency funnels through one
  # phone. Keep it modest (~3-4) behind a single proxy; the higher value
  # below assumes direct egress. Verify the proxy first: GET /proxy/health.
  CRAWL_CONCURRENCY: "6"

  # --- Browser pool ---
  # Kept aligned with CRAWL_CONCURRENCY so concurrent jobs each get a
  # browser tab without oversubscribing. More tabs = more Chromium RAM —
  # the http container's memory limit is sized for this (deployment.yaml).
  BROWSER_MAX_PAGES: "6"
  BROWSER_IDLE_S: "60"
  FETCH_TIMEOUT_MS: "30000"
  FETCH_HEADLESS: "1"
  FETCH_DISABLE_RES: "1"
  FETCH_NETWORK_IDLE: "1"

  # --- Feed polling ---
  FEED_INTERVAL: "3600"
  POLL_TICK_MIN: "30"
  POLL_TICK_MAX: "600"

  # --- Tracing (optional) ---
  LANGSMITH_TRACING: "false"
